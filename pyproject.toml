[project]
name = "ragdemo"
version = "0.1.0"
description = "Question answering over business PDFs with page-level citations and a measured retrieval quality"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=0.80",
    "fastembed>=0.7",
    "pypdfium2>=4.30",
    "rapidocr-onnxruntime>=1.4",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "reportlab>=4.2",
    "pillow>=11.0",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[project.scripts]
ragdemo = "ragdemo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdemo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the local Postgres container (DATABASE_URL)"]
addopts = "-q"
